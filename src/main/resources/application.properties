spring.application.name=hapi-fhir-questionnaire-validator-webapp
server.port=8080

# Limit request body size (2 MiB) for live validation
server.tomcat.max-http-form-post-size=2097152
server.tomcat.max-swallow-size=2097152

# Hosts allowed for custom remote terminology URLs
validator.terminology.allowed-hosts=tx.fhir.org

# Preset terminology servers (empty url = local only)
validator.terminology.presets[0].id=none
validator.terminology.presets[0].label=Local only (no remote)
validator.terminology.presets[0].url=

validator.terminology.presets[1].id=tx-fhir-org-r4
validator.terminology.presets[1].label=HL7 tx.fhir.org (R4)
validator.terminology.presets[1].url=https://tx.fhir.org/r4
